name: Release Drafter

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  draft:
    if: github.repository == 'depot/sdk-node'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7
        with:
          token: ${{ github.token }}
          publish: false
